[project]
name = "anki-for-claude"
version = "2.0.0"
description = "Claude plugin and MCP server for creating and maintaining Anki flashcards"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Prutkow", email = "michael.prutkow@tum.de" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2,<3",
    "youtube-transcript-api>=1.2.4",
]
keywords = ["anki", "mcp", "flashcards", "spaced-repetition", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/MichaelPrutkow/anki-for-claude"
Issues = "https://github.com/MichaelPrutkow/anki-for-claude/issues"

[project.scripts]
anki-mcp = "anki_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv.build-backend]
module-name = "anki_mcp"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
